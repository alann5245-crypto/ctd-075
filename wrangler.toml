name = "hermes-telegram-gateway"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true

[vars]
GITHUB_REPO = "alann5245-crypto/ctd-075"

# ============================================================================
# HƯỚNG DẪN CÀI BIẾN MÔI TRƯỜNG (SECRETS) TRÊN CLOUDFLARE DASHBOARD:
# Sau khi liên kết GitHub Repo với Cloudflare Workers & Pages:
# Vào Worker -> Settings -> Variables and Secrets -> Add:
#
# 1. ALLOWED_CHAT_ID         : ID Telegram cá nhân của bạn (ví dụ: "123456789")
# 2. GITHUB_PAT              : Fine-grained PAT có quyền Contents: Read & Write trên repo ctd-075
# 3. WEBHOOK_SECRET          : Mật khẩu tự chọn (ví dụ: "hermes-secret-2026") để bảo vệ webhook
# 4. TELEGRAM_MAIN_BOT_TOKEN : Token của Bot cố định chính (nơi giao tiếp 2 chiều với Agent)
# 5. TELEGRAM_BOT_TOKEN_1    : Token của Bot đầu vào số 1
# 6. TELEGRAM_BOT_TOKEN_2    : Token của Bot đầu vào số 2
# 7. TELEGRAM_BOT_TOKEN_3    : Token của Bot đầu vào số 3
# ============================================================================
